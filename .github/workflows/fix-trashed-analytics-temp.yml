name: Fix trashed analytics temp

on:
  push:
    branches:
      - feature/v0.6.0-analytics-dashboard
    paths:
      - .github/workflows/fix-trashed-analytics-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main
      - name: Patch analytics dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/modules/analyticsDashboard.ts')
          text = path.read_text()
          text = text.replace(
            '  computeSubmissionAnalytics,\n  getJournalBarWidths,',
            '  computeSubmissionAnalytics,\n  filterVisibleSubmissionRecords,\n  getJournalBarWidths,',
            1,
          )
          text = text.replace(
            'let unsubscribe: (() => void) | null = null;\nlet rootEl: HTMLElement | null = null;',
            'let unsubscribe: (() => void) | null = null;\nlet itemNotifierID: string | null = null;\nlet rootEl: HTMLElement | null = null;',
            1,
          )
          text = text.replace(
            '  unsubscribe = db.onChange(() => scheduleRefresh());\n  void refresh();',
            '''  unsubscribe = db.onChange(() => scheduleRefresh());\n  itemNotifierID = Zotero.Notifier.registerObserver(\n    {\n      notify: (event: string, type: string) => {\n        if (type === "item" && (event === "modify" || event === "delete")) {\n          scheduleRefresh();\n        }\n      },\n    },\n    ["item"],\n    "submission-tracker-analytics",\n  );\n  void refresh();''',
            1,
          )
          text = text.replace(
            '  if (unsubscribe) {\n    unsubscribe();\n    unsubscribe = null;\n  }\n}',
            '''  if (unsubscribe) {\n    unsubscribe();\n    unsubscribe = null;\n  }\n  if (itemNotifierID) {\n    Zotero.Notifier.unregisterObserver(itemNotifierID);\n    itemNotifierID = null;\n  }\n}''',
            1,
          )
          text = text.replace(
            '  const records = await db.getAll();\n  const submissions = await Promise.all(',
            '''  const records = filterVisibleSubmissionRecords(\n    await db.getAll(),\n    (libraryID, itemKey) => {\n      const itemID = Zotero.Items.getIDFromLibraryAndKey(libraryID, itemKey);\n      if (!itemID) return undefined;\n      const item = Zotero.Items.get(itemID) as Zotero.Item | undefined;\n      return item ? { deleted: item.deleted } : undefined;\n    },\n  );\n  const submissions = await Promise.all(''',
            1,
          )
          path.write_text(text)
          PY
      - name: Format
        run: npx prettier --write src/modules/analyticsDashboard.ts src/modules/analytics.ts scripts/analytics.test.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/analyticsDashboard.ts src/modules/analytics.ts scripts/analytics.test.mjs
          git commit -m "fix: hide trashed items from analytics dashboard"
          git push origin HEAD:feature/v0.6.0-analytics-dashboard
