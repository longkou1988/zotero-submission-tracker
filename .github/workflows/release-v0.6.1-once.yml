name: Publish v0.6.1 Release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v0.6.1-once.yml

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main
        with:
          fetch-all: true

      - name: Verify release commit and version
        run: |
          git checkout d6e3c37b5a55ac4b383b0cfcbd4fb218a667846f
          VERSION=$(node -p "require('./package.json').version")
          test "$VERSION" = "0.6.1"

      - name: Create v0.6.1 tag
        run: |
          if git rev-parse v0.6.1 >/dev/null 2>&1; then
            test "$(git rev-parse v0.6.1)" = "d6e3c37b5a55ac4b383b0cfcbd4fb218a667846f"
          else
            git tag v0.6.1 d6e3c37b5a55ac4b383b0cfcbd4fb218a667846f
            git push origin v0.6.1
          fi

      - name: Build v0.6.1
        run: npm run build

      - name: Publish v0.6.1 release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run release
