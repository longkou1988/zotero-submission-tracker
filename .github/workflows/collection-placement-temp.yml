name: Run collection placement patch

on:
  push:
    branches:
      - feature/v0.6.0-analytics-dashboard
    paths:
      - .github/workflows/collection-placement-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: python scripts/patch_collection_placement_temp.py
      - run: npx prettier --write src/modules/dialog.ts src/modules/collectionPlacement.ts scripts/collectionPlacement.test.mjs typings/prefs.d.ts typings/i10n.d.ts addon/prefs.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/dialog.ts src/modules/collectionPlacement.ts scripts/collectionPlacement.test.mjs addon/prefs.js typings/prefs.d.ts addon/locale/zh-CN/addon.ftl addon/locale/en-US/addon.ftl typings/i10n.d.ts
          git commit -m "feat: support collection-aware submission records"
          git push origin HEAD:feature/v0.6.0-analytics-dashboard
