name: Build Springer Viewer Diagnostic R5 Once

on:
  push:
    branches:
      - feature/v0.7.0-springer-auto-sync
    paths:
      - .github/workflows/build-springer-viewer-r5-once.yml

permissions:
  contents: read

jobs:
  build-dev-xpi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7.0-springer-auto-sync
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - name: Build native development XPI
        run: npx zotero-plugin build --dev
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Verify R5 viewer diagnostics are bundled
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('.scaffold/build/addon/manifest.json', 'utf8'));
          if (manifest.version !== '0.6.3') throw new Error(`version=${manifest.version}`);
          if (manifest.name !== 'Submission Tracker — Viewer Diagnostic Test') throw new Error(`name=${manifest.name}`);
          const bundle = fs.readFileSync('.scaffold/build/addon/content/scripts/submissiontracker.js', 'utf8');
          for (const marker of ['viewer-diagnostic-r5-', 'openSpringerLogin', 'checkSpringerLoginViewer', 'runSpringerDiscoveryCheck', 'userContextId', 'newCookieContext']) {
            if (!bundle.includes(marker)) throw new Error(`missing ${marker}`);
          }
          NODE
      - name: Pack native R5 XPI
        run: |
          cd .scaffold/build/addon
          zip -qr ../submission-tracker-viewer-diagnostic-r5-0.6.3.xpi .
      - name: Upload native R5 XPI
        uses: actions/upload-artifact@v4
        with:
          name: springer-viewer-diagnostic-r5-xpi
          path: .scaffold/build/submission-tracker-viewer-diagnostic-r5-0.6.3.xpi
          if-no-files-found: error
