name: Update v0.6.1 Release Notes Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-v061-release-notes-once.yml

permissions:
  contents: write

jobs:
  update-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update bilingual release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/v061-notes.md <<'EOF'
          ## v0.6.1 · 投稿分析界面修复 / Analytics UI Fix

          ### 中文

          **v0.6.1 修复**

          - 修复“投稿分析 → 期刊表现”区域在部分 Zotero 窗口宽度下被压缩的问题。
          - 投稿分析顶层面板保持完整宽度，不再被 Flex 布局缩略。
          - 宽表格继续保留横向滚动，不影响期刊统计信息完整显示。

          **当前 v0.6.x 主要功能**

          - **投稿分析 Dashboard**：总投稿、进行中、已录用、已拒稿、录用率、拒稿率、平均首次决定时间。
          - **交互式图表**：投稿结果环形图、年度投稿趋势、期刊表现；支持点击 KPI、图表、年份和期刊下钻筛选。
          - **组合筛选**：年份 + 状态 + 期刊联动筛选，筛选结果可直接打开投稿详情。
          - **Smart Next Action / 下一步建议**：根据投稿状态、跟进日期和等待时间给出下一步动作。
          - **Inquiry Assistant / 催稿助手**：本地生成中英文催稿邮件模板，不调用 AI 或第三方服务。
          - **Zotero Collection 分类保存**：新增投稿时默认跟随当前分类，也可手动选择其他 Collection 或资料库根目录。
          - **废纸篓联动**：移入 Zotero 废纸篓后从统计中隐藏，恢复后重新出现，永久删除才清理投稿记录。
          - **9 种投稿状态时间线**：草稿、已投稿、编辑部审核、外审中、大修、小修、录用、拒稿、撤稿。
          - **状态页与稿件编号**：保存投稿系统网址、Manuscript ID 和最近查看时间，可直接在 Zotero 标签页打开。
          - **跟进提醒、CSV 导出、JSON 备份/恢复、中英文界面、深浅色主题适配**。

          **主要入口**

          - `工具 → 打开投稿管理`：全局投稿管理。
          - `工具 → 投稿分析`：投稿统计与交互分析。
          - `右键文献 → 投稿记录 → 添加投稿记录`：新增投稿并选择保存分类。
          - 投稿记录菜单中的“下一步建议”和“催稿助手”：处理待办与编辑沟通。

          ---

          ### English

          **v0.6.1 fix**

          - Fixes the **Submission Analytics → Journal Performance** panel shrinking on some Zotero window sizes.
          - Keeps top-level analytics panels at full available width instead of allowing the flex layout to compress them.
          - Preserves horizontal scrolling for wide journal-performance tables so all metrics remain accessible.

          **Current v0.6.x highlights**

          - **Submission Analytics Dashboard**: total, active, accepted, rejected, acceptance rate, rejection rate, and average first-decision time.
          - **Interactive charts**: outcome donut, yearly submission trend, and journal performance with KPI/chart/year/journal drill-down.
          - **Combined filters**: year + status + journal, with filtered records opening directly into submission details.
          - **Smart Next Action**: recommends the next step from current status, follow-up date, and elapsed time.
          - **Inquiry Assistant**: generates Chinese and English inquiry templates locally; no AI or third-party service is called.
          - **Zotero Collection-aware placement**: default to the current Collection or manually choose another Collection or the library root.
          - **Trash integration**: trashed Zotero items are excluded from analytics, restored items return, and records are cleaned only after permanent deletion.
          - **Nine-state submission timeline**: Draft, Submitted, With Editor, Under Review, Major Revision, Minor Revision, Accepted, Rejected, Withdrawn.
          - **Status-page and manuscript-ID support**: save submission-system URLs, Manuscript IDs, and last-checked timestamps; open status pages in Zotero tabs.
          - **Follow-up reminders, CSV export, JSON backup/restore, bilingual UI, and adaptive light/dark themes**.

          **Main entry points**

          - `Tools → Open Submission Dashboard`: global submission management.
          - `Tools → Submission Analytics`: statistics and interactive analytics.
          - `Right-click item → Submission Records → Add Submission Record`: create a submission and choose its Collection.
          - `Smart Next Action` and `Inquiry Assistant` in the Submission Records menu: manage next steps and editor communication.

          ### Installation / 安装

          Download `submission-tracker.xpi` below and install it via Zotero → Tools → Plugins → gear icon → **Install Add-on From File…**.

          下载下方 `submission-tracker.xpi`，在 Zotero → 工具 → 插件 → 齿轮图标 → **Install Add-on From File…** 安装。
          EOF
          gh release edit v0.6.1 --notes-file /tmp/v061-notes.md
