name: Format Springer Discovery Once

on:
  push:
    branches:
      - feature/v0.7.0-springer-auto-sync
    paths:
      - .github/workflows/format-springer-discovery-once.yml

permissions:
  contents: write

jobs:
  format-springer-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7.0-springer-auto-sync
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: >-
          npx prettier --write
          docs/superpowers/plans/2026-09-04-springer-discovery-foundation.md
          docs/superpowers/specs/2026-09-04-springer-account-discovery-import-design.md
          src/modules/statusSync/discoveryTypes.ts
          src/modules/statusSync/springerAccountDiscovery.ts
      - name: Commit formatted discovery files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/superpowers/plans/2026-09-04-springer-discovery-foundation.md \
            docs/superpowers/specs/2026-09-04-springer-account-discovery-import-design.md \
            src/modules/statusSync/discoveryTypes.ts \
            src/modules/statusSync/springerAccountDiscovery.ts
          git commit -m "style: format Springer discovery files"
          git push origin HEAD:feature/v0.7.0-springer-auto-sync
