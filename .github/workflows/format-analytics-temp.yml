name: Format analytics temp

on:
  push:
    branches:
      - feature/v0.6.0-analytics-dashboard
    paths:
      - .github/workflows/format-analytics-temp.yml
      - src/modules/analyticsDashboard.ts

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main
      - name: Format analytics dashboard
        run: npx prettier --write src/modules/analyticsDashboard.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/analyticsDashboard.ts
          git commit -m "style: format analytics dashboard"
          git push origin HEAD:feature/v0.6.0-analytics-dashboard
