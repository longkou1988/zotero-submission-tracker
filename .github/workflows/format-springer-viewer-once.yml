name: Format Springer Viewer Once

on:
  push:
    branches:
      - feature/v0.7.0-springer-auto-sync
    paths:
      - .github/workflows/format-springer-viewer-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7.0-springer-auto-sync
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npx prettier --write src/modules/statusSync/sessionManager.ts scripts/springerLoginViewerDiagnostics.test.mjs
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git add src/modules/statusSync/sessionManager.ts scripts/springerLoginViewerDiagnostics.test.mjs
          git commit -m "style: format Springer viewer diagnostics"
          git push origin HEAD:feature/v0.7.0-springer-auto-sync
