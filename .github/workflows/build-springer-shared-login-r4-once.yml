name: Build Springer Shared Login R4 Once

on:
  push:
    branches:
      - feature/v0.7.0-springer-auto-sync
    paths:
      - .github/workflows/build-springer-shared-login-r4-once.yml

permissions:
  contents: read

jobs:
  build-dev-xpi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7.0-springer-auto-sync
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - name: Build native development XPI
        run: npx zotero-plugin build --dev
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Verify native R4 build markers
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('.scaffold/build/addon/manifest.json', 'utf8'));
          if (manifest.version !== '0.6.2') throw new Error(`version=${manifest.version}`);
          if (manifest.name !== 'Submission Tracker — Shared Login Test') throw new Error(`name=${manifest.name}`);
          const bundle = fs.readFileSync('.scaffold/build/addon/content/scripts/submissiontracker.js', 'utf8');
          for (const marker of ['shared-login-r4-', 'openSpringerLogin', 'runSpringerDiscoveryCheck', 'userContextId', 'newCookieContext']) {
            if (!bundle.includes(marker)) throw new Error(`missing ${marker}`);
          }
          NODE
      - name: Pack native R4 XPI
        run: |
          cd .scaffold/build/addon
          zip -qr ../submission-tracker-shared-login-r4-0.6.2.xpi .
      - name: Upload native R4 XPI
        uses: actions/upload-artifact@v4
        with:
          name: springer-shared-login-r4-xpi
          path: .scaffold/build/submission-tracker-shared-login-r4-0.6.2.xpi
          if-no-files-found: error
