name: Run collection picker fix

on:
  push:
    branches:
      - feature/v0.6.0-analytics-dashboard
    paths:
      - .github/workflows/collection-picker-fix-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: python scripts/patch_collection_picker_temp.py
      - run: npx prettier --write src/modules/ui.ts src/modules/dialog.ts addon/content/dialog.css scripts/collectionPlacement.test.mjs
      - run: npm run test:unit
      - run: npm run build
      - run: npm run lint:check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/ui.ts src/modules/dialog.ts addon/content/dialog.css scripts/collectionPlacement.test.mjs
          git commit -m "fix: make collection picker selectable in Zotero dialogs"
          git push origin HEAD:feature/v0.6.0-analytics-dashboard

# rerun after regression-test lint fix
