name: Format README Once

on:
  push:
    branches:
      - docs/v0.6.1-bilingual-readme
    paths:
      - .github/workflows/format-readme-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/v0.6.1-bilingual-readme
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npx prettier --write README.md
      - name: Commit formatted README
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: format bilingual README"
          git push origin HEAD:docs/v0.6.1-bilingual-readme
