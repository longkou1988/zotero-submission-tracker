name: Format Discovery Store Once

on:
  push:
    branches:
      - feature/v0.7.0-springer-auto-sync
    paths:
      - .github/workflows/format-discovery-store-once.yml

permissions:
  contents: write

jobs:
  format-discovery-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.7.0-springer-auto-sync
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: >-
          npx prettier --write
          scripts/statusSyncDiscoveryPersistence.test.mjs
          src/modules/statusSync/discoveryStore.ts
          src/modules/statusSync/discoveryTypes.ts
      - name: Commit formatted discovery store files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/statusSyncDiscoveryPersistence.test.mjs \
            src/modules/statusSync/discoveryStore.ts \
            src/modules/statusSync/discoveryTypes.ts
          git commit -m "style: format discovery store files"
          git push origin HEAD:feature/v0.7.0-springer-auto-sync
