name: Publish v0.6.0 Release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v0.6.0-once.yml

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main
        with:
          fetch-all: true

      - name: Verify release version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "$VERSION" = "0.6.0"

      - name: Verify v0.6.0 tag
        run: |
          git fetch --tags --force
          test "$(git rev-parse v0.6.0)" = "96d3ceb1df1e3fc426db33727416a9a8f0c030a5"

      - name: Build v0.6.0
        run: npm run build

      - name: Publish v0.6.0 release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run release
